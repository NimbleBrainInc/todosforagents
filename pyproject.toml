[project]
name = "todosforagents"
version = "0.2.0"
description = "To-do boards for AI agents, as an MCP server with a board UI. Runs locally on one SQLite file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" },
]
keywords = ["mcp", "mcp-server", "mcp-apps", "todos", "to-do", "kanban", "agents", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # FastMCP 4 on the MCP SDK v2: serves the 2026-07-28 era and the session-based eras from
    # one server. The ceiling excludes the next major, which removes 4.x compatibility shims.
    "fastmcp>=4,<5",
    "mcp>=2,<3",
    "pydantic>=2.12",
    # Below 2.1: 2.1 compiles a LIKE's ESCAPE literal differently on Postgres, which changes the
    # search predicate tests/golden/paging.txt freezes. Moving to 2.1 is a reviewed change.
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    # Annotations, announcements, listing rows, ids, skills and the error contract: the SDK
    # core only, no extras. Pinned exactly: tests/golden/surface.json gates every bump.
    "nimblebrain-server-sdk==0.4.1",
    # Keyset paging. Pinned exactly: tests/test_paging_golden.py holds the cursors agents
    # already hold, so an upgrade is a deliberate, reviewed change.
    "pgkeyset==0.2.0",
    # The local runtime: SQLite through aiosqlite, and its schema history through Alembic.
    "aiosqlite>=0.21",
    "alembic>=1.14",
]

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/todosforagents"
Repository = "https://github.com/NimbleBrainInc/todosforagents.git"
Issues = "https://github.com/NimbleBrainInc/todosforagents/issues"

[project.scripts]
todosforagents = "mcp_todos_local.__main__:main"

[project.entry-points."mcp_todos.runtimes"]
local = "mcp_todos_local.runtime:LocalRuntime"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_todos", "src/mcp_todos_local"]

# Packs the built UI (ui/dist/index.html) into the wheel as mcp_todos/ui_dist/index.html, and
# refuses to build a wheel without it.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the built UI, so a wheel built from it (pip, uv) packs the same board.
# It is a build output (ui/ is gitignored there), so it is named here, not found through git.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/ui/dist/index.html",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]
artifacts = ["/ui/dist/index.html"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_todos", "mcp_todos_local"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6",
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
]

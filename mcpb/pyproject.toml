# The MCP bundle's project: it installs the released todosforagents from PyPI and nothing else.
# The release workflow locks it (uv.lock) once that version is on PyPI, and packs the lock into
# the bundle, so `uv run --frozen` installs exactly what was tested. The pin must equal the
# package's version (tests/test_mcpb.py).
[project]
name = "todosforagents-mcpb"
version = "0.1.0"
description = "The Todos for Agents MCP bundle: runs the todosforagents package with uv."
requires-python = ">=3.13,<3.15"
dependencies = ["todosforagents==0.1.0"]

[tool.uv]
package = false

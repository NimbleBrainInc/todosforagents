name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole gate on each supported Python: format, lint, ty, the UI build, every suite (the
  # store and tools in process, the local runtime as separate processes over stdio and HTTP),
  # the wheel check, and the UI typecheck and tests. CI=true turns a skip into a failure.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: make verify

  # What a release publishes: the sdist, the wheel built from it, and that wheel started the
  # way a user starts it (uvx, stdio).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: make dist
      - run: uv run python scripts/smoke.py uvx --from "$(ls dist/*.whl)" todosforagents

  # One required check that stands for the jobs, so the ruleset need not list each.
  verify:
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          test "${{ needs.test.result }}" = success
          && test "${{ needs.package.result }}" = success
